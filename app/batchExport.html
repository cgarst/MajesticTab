<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk Export PDFs — MajesticTab</title>
  <link rel="icon" type="image/x-icon" href="../icons/favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
  <style>
    body {
      overflow-y: auto !important;
      height: auto !important;
      min-height: 100vh;
    }
    .export-container {
      max-width: 820px;
      margin: 2.5rem auto 4rem auto;
      padding: 0 1.25rem;
    }
    .export-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 12px 32px -4px rgba(0, 0, 0, 0.6);
    }
    .export-header {
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
    }
    .drop-zone {
      border: 2px dashed var(--border-prominent);
      background: var(--bg-card-solid);
      border-radius: 0.85rem;
      padding: 2.5rem 1.5rem;
      text-align: center;
      margin-bottom: 1.5rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text-muted);
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent-primary);
      background: var(--bg-card-hover);
      color: var(--text-primary);
    }
    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: var(--bg-card-solid);
      border: 1px solid var(--border-subtle);
      border-radius: 0.6rem;
      margin-bottom: 0.5rem;
    }
    .status-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      margin-right: 0.75rem;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .status-icon.complete {
      opacity: 1;
      color: #10b981;
    }
    .progress-container {
      display: none;
      margin: 1.25rem 0;
    }
    .progress-bar-custom {
      height: 12px;
      background: var(--accent-primary);
      width: 0%;
      transition: width 0.3s ease;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <!-- Windows native shell: custom window controls (shown via .tauri-windows) -->
  <div id="winControls" role="group" aria-label="Window controls">
    <button type="button" class="win-ctrl-btn" id="winMinBtn" title="Minimize" aria-label="Minimize"><i class="bi-dash-lg"></i></button>
    <button type="button" class="win-ctrl-btn" id="winMaxBtn" title="Maximize" aria-label="Maximize"><i class="bi-square" id="winMaxIcon"></i></button>
    <button type="button" class="win-ctrl-btn win-ctrl-close" id="winCloseBtn" title="Close" aria-label="Close"><i class="bi-x-lg"></i></button>
  </div>

  <!-- Minimal Header Bar -->
  <header id="topBar" data-tauri-drag-region>
    <div id="brandSection" data-tauri-drag-region>
      <a href="./" class="brand-btn text-decoration-none" title="Return to MajesticTab">
        <i class="bi-arrow-left me-1"></i> Back to App
      </a>
      <span class="fs-6 fw-bold tracking-tight text-white ms-2">MajesticTab</span>
    </div>
    <div id="rightSection" data-tauri-drag-region></div>
  </header>

  <main class="export-container">
    <div class="export-card">
      <div class="export-header">
        <div class="d-flex align-items-center gap-3 mb-2">
          <div class="brand-btn p-2" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 0.85rem;">
            <i class="bi-file-earmark-pdf text-danger fs-4"></i>
          </div>
          <div>
            <h1 class="h3 fw-bold text-white mb-0">Bulk Export PDFs</h1>
            <div class="small text-muted">Condense and export multiple tab PDFs into optimized layouts</div>
          </div>
        </div>
      </div>

      <div class="drop-zone" id="dropZone">
        <i class="bi-cloud-arrow-up fs-1 d-block mb-2 text-primary"></i>
        <div class="fw-semibold text-white mb-1">Drop PDF files here or click to select</div>
        <div class="small text-muted">Supports multiple .pdf files</div>
        <input type="file" id="fileInput" multiple accept=".pdf" style="display: none">
      </div>

      <div id="fileList"></div>

      <div class="row align-items-center g-3 my-3">
        <div class="col-auto">
          <label for="scaleInput" class="col-form-label text-white fw-semibold small">Render Scale:</label>
        </div>
        <div class="col-auto">
          <input type="number" id="scaleInput" class="form-control form-control-sm text-center" value="1.5" min="0.5" max="5" step="0.1" style="width: 80px; background: var(--bg-card-solid); color: var(--text-primary); border-color: var(--border-subtle);">
        </div>
        <div class="col-auto">
          <span class="small text-muted">(Higher = sharper, but slower. Default: 1.5)</span>
        </div>
      </div>

      <div class="d-flex gap-2">
        <button id="processButton" class="btn btn-theme-primary px-4 py-2 fw-semibold" disabled>
          <i class="bi-gear-wide-connected me-1"></i> Process & Export All
        </button>
      </div>

      <div class="progress-container" id="progressContainer">
        <div class="progress" style="height: 12px; background: var(--bg-card-solid); border: 1px solid var(--border-subtle); border-radius: 6px;">
          <div class="progress-bar-custom" id="progressBar"></div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { processPDF } from './pdfProcessor/pdfProcessor.js';
    import { initTheming } from './themeEngine.js';

    // Initialize active theme
    initTheming();

    // Native macOS shell uses an overlay title bar; reserve room for the traffic lights.
    if (window.__TAURI__ && /Mac/i.test(navigator.platform)) {
      const root = document.documentElement;
      const appWindow = window.__TAURI__.window?.getCurrentWindow?.();
      let syncToken = 0;
      const syncTitleBarInset = async () => {
        const token = ++syncToken;
        let fs = !!(document.fullscreenElement || document.webkitFullscreenElement);
        if (!fs && appWindow) {
          try { fs = await appWindow.isFullscreen(); } catch {}
        }
        if (token === syncToken) root.classList.toggle('tauri-macos', !fs);
      };
      let settleTimer = 0;
      const scheduleSync = () => {
        syncTitleBarInset();
        clearTimeout(settleTimer);
        settleTimer = setTimeout(syncTitleBarInset, 600);
      };
      syncTitleBarInset();
      window.addEventListener('resize', scheduleSync);
      document.addEventListener('fullscreenchange', scheduleSync);
      document.addEventListener('webkitfullscreenchange', scheduleSync);
    }

    // Native Windows shell is undecorated; draw window controls on the right and shift the top bar controls left.
    if (window.__TAURI__ && /Win/i.test(navigator.platform)) {
      const root = document.documentElement;
      const appWindow = window.__TAURI__.window?.getCurrentWindow?.();
      const maxIcon = document.getElementById('winMaxIcon');
      const maxBtn = document.getElementById('winMaxBtn');
      let syncToken = 0;
      const syncWindowState = async () => {
        const token = ++syncToken;
        let fs = !!(document.fullscreenElement || document.webkitFullscreenElement);
        let maximized = false;
        if (appWindow) {
          try { if (!fs) fs = await appWindow.isFullscreen(); } catch {}
          try { maximized = await appWindow.isMaximized(); } catch {}
        }
        if (token !== syncToken) return;
        root.classList.toggle('tauri-windows', !fs);
        if (maxIcon) maxIcon.className = maximized ? 'bi-fullscreen-exit' : 'bi-square';
        if (maxBtn) { const t = maximized ? 'Restore' : 'Maximize'; maxBtn.title = t; maxBtn.setAttribute('aria-label', t); }
      };
      let settleTimer = 0;
      const scheduleSync = () => {
        syncWindowState();
        clearTimeout(settleTimer);
        settleTimer = setTimeout(syncWindowState, 400);
      };
      document.getElementById('winMinBtn')?.addEventListener('click', () => appWindow?.minimize());
      maxBtn?.addEventListener('click', () => appWindow?.toggleMaximize());
      document.getElementById('winCloseBtn')?.addEventListener('click', () => appWindow?.close());
      syncWindowState();
      window.addEventListener('resize', scheduleSync);
      document.addEventListener('fullscreenchange', scheduleSync);
      document.addEventListener('webkitfullscreenchange', scheduleSync);
    }

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const processButton = document.getElementById('processButton');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const scaleInput = document.getElementById('scaleInput');
    
    let files = [];
    let processedFiles = new Set();

    // Handle drag and drop
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });

    dropZone.addEventListener('click', () => {
      fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
      handleFiles(e.target.files);
    });

    function handleFiles(selectedFiles) {
      files = files.filter(file => !processedFiles.has(file.name));
      
      for (const file of selectedFiles) {
        if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
          if (!files.some(f => f.name === file.name)) {
            files.push(file);
          }
        }
      }
      updateFileList();
      processButton.disabled = files.length === 0;
    }

    function updateFileList() {
      fileList.innerHTML = '';
      files.forEach((file, index) => {
        const fileItem = document.createElement('div');
        fileItem.className = 'file-item';
        fileItem.innerHTML = `
          <div class="d-flex align-items-center text-truncate me-2">
            <span class="status-icon" id="status-${index}"><i class="bi-check-circle-fill"></i></span>
            <span class="text-white small text-truncate">${file.name}</span>
          </div>
          <button class="btn btn-sm btn-theme-danger py-0 px-2" onclick="removeFile(${index})">
            <i class="bi-trash"></i>
          </button>
        `;
        fileList.appendChild(fileItem);
      });
    }

    window.removeFile = (index) => {
      files.splice(index, 1);
      updateFileList();
      processButton.disabled = files.length === 0;
    };

    processButton.addEventListener('click', async () => {
      processButton.disabled = true;
      progressContainer.style.display = 'block';
      
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        progressBar.style.width = `${(i / files.length * 100)}%`;
        
        const condensedCanvases = [];
        await processPDF(file, {
          debugMode: { checked: false },
          originalMode: { checked: false },
          progressContainer,
          progressBar,
          condensedCanvases,
          onCanvasRendered: () => {},
          abortSignal: null,
          scale: parseFloat(scaleInput.value)
        });

        // Convert canvases to PDF with A4 layout
        const pdfDoc = await PDFLib.PDFDocument.create();
        const A4_WIDTH = 595.276;
        const A4_HEIGHT = 841.890;
        const PAGE_MARGIN = 0;
        const TOP_MARGIN = 30;
        const SPACING = 5;
        
        let currentPage = null;
        let yOffset = A4_HEIGHT - TOP_MARGIN;
        
        for (const canvas of condensedCanvases) {
          const pngData = canvas.toDataURL('image/png');
          const pngImage = await pdfDoc.embedPng(pngData);
          
          const scale = (A4_WIDTH - 2 * PAGE_MARGIN) / pngImage.width;
          const scaledWidth = pngImage.width * scale;
          const scaledHeight = pngImage.height * scale;
          
          if (!currentPage || yOffset - scaledHeight < PAGE_MARGIN) {
            currentPage = pdfDoc.addPage([A4_WIDTH, A4_HEIGHT]);
            yOffset = A4_HEIGHT - TOP_MARGIN;
          }
          
          currentPage.drawImage(pngImage, {
            x: PAGE_MARGIN,
            y: yOffset - scaledHeight,
            width: scaledWidth,
            height: scaledHeight,
          });
          
          yOffset -= (scaledHeight + SPACING);
        }

        const pdfBytes = await pdfDoc.save();
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        const downloadLink = document.createElement('a');
        downloadLink.href = URL.createObjectURL(blob);
        downloadLink.download = `Majestic_${file.name}`;
        downloadLink.click();
        URL.revokeObjectURL(downloadLink.href);

        const statusIcon = document.getElementById(`status-${i}`);
        if (statusIcon) statusIcon.classList.add('complete');
        processedFiles.add(file.name);
      }

      progressBar.style.width = '100%';
      setTimeout(() => {
        progressContainer.style.display = 'none';
        progressBar.style.width = '0%';
        processButton.disabled = false;
      }, 1000);
    });
  </script>
</body>
</html>
