app-id: net.zathu.majestictab
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: majestictab
finish-args:
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=x11
  - --device=all
modules:
  - name: majestictab
    buildsystem: simple
    build-commands:
      - install -Dm755 majestictab /app/bin/majestictab.bin
      - install -Dm755 majestictab-wrapper.sh /app/bin/majestictab
      - install -Dm644 net.zathu.majestictab.desktop /app/share/applications/net.zathu.majestictab.desktop
      - install -Dm644 net.zathu.majestictab.metainfo.xml /app/share/metainfo/net.zathu.majestictab.metainfo.xml
      - install -Dm644 net.zathu.majestictab-16.png /app/share/icons/hicolor/16x16/apps/net.zathu.majestictab.png
      - install -Dm644 net.zathu.majestictab-24.png /app/share/icons/hicolor/24x24/apps/net.zathu.majestictab.png
      - install -Dm644 net.zathu.majestictab-32.png /app/share/icons/hicolor/32x32/apps/net.zathu.majestictab.png
      - install -Dm644 net.zathu.majestictab-48.png /app/share/icons/hicolor/48x48/apps/net.zathu.majestictab.png
      - install -Dm644 net.zathu.majestictab-64.png /app/share/icons/hicolor/64x64/apps/net.zathu.majestictab.png
      - install -Dm644 net.zathu.majestictab-128.png /app/share/icons/hicolor/128x128/apps/net.zathu.majestictab.png
      - install -Dm644 net.zathu.majestictab-256.png /app/share/icons/hicolor/256x256/apps/net.zathu.majestictab.png
      - install -Dm644 net.zathu.majestictab-512.png /app/share/icons/hicolor/512x512/apps/net.zathu.majestictab.png
      - install -Dm644 net.zathu.majestictab.svg /app/share/icons/hicolor/scalable/apps/net.zathu.majestictab.svg
    sources:
      - type: file
        path: ../target/release/majestictab
        dest-filename: majestictab
      - type: file
        path: majestictab-wrapper.sh
        dest-filename: majestictab-wrapper.sh
      - type: file
        path: net.zathu.majestictab.desktop
      - type: file
        path: net.zathu.majestictab.metainfo.xml
      - type: file
        path: ../src-tauri/icons/linux/16x16.png
        dest-filename: net.zathu.majestictab-16.png
      - type: file
        path: ../src-tauri/icons/linux/24x24.png
        dest-filename: net.zathu.majestictab-24.png
      - type: file
        path: ../src-tauri/icons/linux/32x32.png
        dest-filename: net.zathu.majestictab-32.png
      - type: file
        path: ../src-tauri/icons/linux/48x48.png
        dest-filename: net.zathu.majestictab-48.png
      - type: file
        path: ../src-tauri/icons/linux/64x64.png
        dest-filename: net.zathu.majestictab-64.png
      - type: file
        path: ../src-tauri/icons/linux/128x128.png
        dest-filename: net.zathu.majestictab-128.png
      - type: file
        path: ../src-tauri/icons/linux/256x256.png
        dest-filename: net.zathu.majestictab-256.png
      - type: file
        path: ../src-tauri/icons/linux/512x512.png
        dest-filename: net.zathu.majestictab-512.png
      - type: file
        path: ../src-tauri/icons/linux/net.zathu.majestictab.svg
        dest-filename: net.zathu.majestictab.svg