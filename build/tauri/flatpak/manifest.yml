app-id: io.github.cgarst.MajesticTab
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: majestictab
finish-args:
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: majestictab
    buildsystem: simple
    build-commands:
      - install -Dm755 majestictab /app/bin/majestictab
      - install -Dm644 io.github.cgarst.MajesticTab.desktop /app/share/applications/io.github.cgarst.MajesticTab.desktop
      - install -Dm644 io.github.cgarst.MajesticTab.png /app/share/icons/hicolor/512x512/apps/io.github.cgarst.MajesticTab.png
    sources:
      - type: file
        path: ../target/release/majestictab
        dest-filename: majestictab
      - type: file
        path: io.github.cgarst.MajesticTab.desktop
      - type: file
        path: ../../../icons/android-chrome-512x512.png
        dest-filename: io.github.cgarst.MajesticTab.png