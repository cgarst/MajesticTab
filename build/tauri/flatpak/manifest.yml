app-id: net.zathu.majestictab
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: majestictab
finish-args:
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: majestictab
    buildsystem: simple
    build-commands:
      - install -Dm755 majestictab /app/bin/majestictab
      - install -Dm644 net.zathu.majestictab.desktop /app/share/applications/net.zathu.majestictab.desktop
      - install -Dm644 net.zathu.majestictab.png /app/share/icons/hicolor/512x512/apps/net.zathu.majestictab.png
    sources:
      - type: file
        path: ../target/release/majestictab
        dest-filename: majestictab
      - type: file
        path: net.zathu.majestictab.desktop
      - type: file
        path: ../src-tauri/icons/linux/512x512.png
        dest-filename: net.zathu.majestictab.png