[package]
name = "majestictab"
version = "1.0.0"
description = "Guitar tab viewer"
authors = ["MajesticTab contributors"]
edition = "2021"

[features]
debug-tools = ["tauri/devtools"]

[lib]
name = "majestictab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-oauth = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-google-auth = { path = "../plugins/google-auth" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["default-tls"] }
percent-encoding = "2.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSView", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSURLRequest"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "objc2-core-foundation"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKNavigation"] }
