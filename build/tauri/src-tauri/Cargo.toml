[package]
name = "majestictab"
version = "1.0.0"
description = "Guitar tab viewer"
authors = ["MajesticTab contributors"]
edition = "2021"

[features]
# Store channels turn these off (see build/channels.mjs); build-tauri.mjs rewrites `default` per channel.
default = ["self-update"]
debug-tools = ["tauri/devtools"]
# In-app updater (desktop only; the dependency does not exist on mobile)
self-update = ["dep:tauri-plugin-updater"]
# In-app purchase for the Supporter unlock (App Store and Google Play channels only)
iap = ["dep:tauri-plugin-iap"]

[lib]
name = "majestictab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-oauth = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
# Lets the S3 client call buckets without browser CORS rules
tauri-plugin-http = "2"
tauri-plugin-google-auth = { path = "../plugins/google-auth" }
# Release candidate; pinned exactly. Only compiled with the `iap` feature.
tauri-plugin-iap = { version = "=0.10.0-rc.10", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["default-tls"] }
percent-encoding = "2.3"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
local-ip-address = "0.6.13"

# Folder chooser for local incremental backups; phones have no usable folder picker
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-updater = { version = "2", optional = true }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
mdns-sd = "0.21.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSEvent", "NSApplication", "NSGraphicsContext", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSURLRequest", "NSGeometry"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "objc2-core-foundation"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKNavigation"] }
block2 = "0.6"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-ui-kit = { version = "0.3", features = ["UIColor", "UIView", "UIViewController", "UIScrollView"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSFileManager", "NSURLRequest", "NSGeometry"] }
block2 = "0.6"

