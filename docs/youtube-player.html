<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex">
  <title>MajesticTab YouTube player</title>
  <style>
    html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; overflow: hidden; background: #000; }
  </style>
</head>
<body>
  <!--
    Embedded by the MajesticTab desktop apps whose own origin (tauri://localhost) YouTube rejects with error 153.
    It frames the YouTube player under this https origin and relays the player's postMessage traffic to and from the app.
    Query: v (11-character video id), autoplay (0 or 1), start (seconds).
  -->
  <iframe id="player" title="YouTube player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var id = params.get('v') || '';
      var player = document.getElementById('player');
      if (!/^[A-Za-z0-9_-]{11}$/.test(id) || window.parent === window) return;

      var url = new URL('https://www.youtube-nocookie.com/embed/' + id);
      url.searchParams.set('autoplay', params.get('autoplay') === '1' ? '1' : '0');
      url.searchParams.set('enablejsapi', '1');
      url.searchParams.set('playsinline', '1');
      url.searchParams.set('origin', location.origin);
      url.searchParams.set('widget_referrer', location.origin);
      var start = parseInt(params.get('start') || '0', 10);
      if (start > 0) url.searchParams.set('start', String(start));
      player.src = url.href;

      window.addEventListener('message', function (event) {
        if (event.source === window.parent) {
          // The app's commands and its "listening" handshake go to YouTube as they are.
          if (player.contentWindow) player.contentWindow.postMessage(event.data, 'https://www.youtube-nocookie.com');
        } else if (event.source === player.contentWindow) {
          // YouTube's state and time reports go back to the app.
          window.parent.postMessage(event.data, '*');
        }
      });
    })();
  </script>
</body>
</html>
