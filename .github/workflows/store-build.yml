name: Store build

# Manual builds of a store distribution channel (see build/channels.mjs).
# Also called by release.yml for every store channel on a version tag.
# The fdroid channel builds the unsigned APK F-Droid's own server builds from source; here it only checks
# that the build still works and gives you the file to inspect.
# These upload workflow artifacts only. They never create a GitHub release or latest.json, so a store
# binary can't become an update target for the `direct` builds (release.yml and canary.yml, unchanged).

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      build_id:
        description: Build identifier embedded in the app (defaults to the run number)
        required: false
        type: string
        default: ''
      build_number:
        description: App Store build number (defaults to the run number)
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      channel:
        description: Store channel to build
        required: true
        type: choice
        options:
          - play
          - fdroid
          - appstore-ios
          - appstore-mac
          - msstore
      build_number:
        description: App Store build number (appstore channels; for a dry run use 1000 or more, above any real run number)
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  MAJESTICTAB_CHANNEL: stable
  MAJESTICTAB_BUILD_ID: ${{ inputs.build_id || github.run_number }}

jobs:
  build:
    runs-on: ${{ fromJSON('{"play":"ubuntu-latest","fdroid":"ubuntu-latest","appstore-ios":"xcode-27","appstore-mac":"xcode-27","msstore":"windows-latest"}')[inputs.channel] }}
    env:
      TARGET: ${{ fromJSON('{"play":"android","fdroid":"android","appstore-ios":"ios","appstore-mac":"macos","msstore":"windows"}')[inputs.channel] }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: build/tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ (inputs.channel == 'play' || inputs.channel == 'fdroid') && 'aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android' || inputs.channel == 'appstore-ios' && 'aarch64-apple-ios' || inputs.channel == 'msstore' && 'aarch64-pc-windows-msvc' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: build/tauri/src-tauri -> ../target
          key: ${{ inputs.channel }}

      - uses: actions/setup-java@v5
        if: inputs.channel == 'play' || inputs.channel == 'fdroid'
        with:
          distribution: temurin
          java-version: 17
      - name: Locate Android NDK
        if: inputs.channel == 'play' || inputs.channel == 'fdroid'
        run: |
          if [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_PATH=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
            echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          elif [ -n "$ANDROID_NDK_HOME" ]; then
            echo "NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          fi
      - name: Restore release keystore
        if: inputs.channel == 'play'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_B64" || { echo "::error::Missing ANDROID_KEYSTORE_B64 secret"; exit 1; }
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      # The iOS plugins use iOS 27 SDK APIs (hinge and fold geometry), so the build needs Xcode 27; the xcode-27 runner has it.
      - name: Show Xcode
        if: inputs.channel == 'appstore-ios' || inputs.channel == 'appstore-mac'
        run: xcodebuild -version
      - name: Install iOS build tools
        if: inputs.channel == 'appstore-ios'
        run: brew install xcodegen

      # Apple signing material goes into a temporary keychain that is deleted at the end. The Mac needs the distribution and installer
      # certificates plus the profile; iOS uses Xcode's automatic signing with the App Store Connect API key (no profile file).
      - name: Set up Apple signing
        if: inputs.channel == 'appstore-ios' || inputs.channel == 'appstore-mac'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE_P12: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_P12 }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          MACOS_PROVISIONING_PROFILE_B64: ${{ secrets.MACOS_PROVISIONING_PROFILE_B64 }}
          IOS_PROVISIONING_PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "::error::Missing $name secret"; exit 1; }
          done
          keychain="$RUNNER_TEMP/appstore.keychain-db"
          password=$(uuidgen)
          echo "APPSTORE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          import_p12() {
            echo "$1" | base64 -d > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$2" -T /usr/bin/codesign -T /usr/bin/productbuild
            rm -f "$RUNNER_TEMP/cert.p12"
          }
          import_p12 "$APPLE_CERTIFICATE_P12" "$APPLE_CERTIFICATE_PASSWORD"
          if [ "$TARGET" = macos ]; then
            for name in APPLE_INSTALLER_CERTIFICATE_P12 APPLE_INSTALLER_CERTIFICATE_PASSWORD MACOS_PROVISIONING_PROFILE_B64; do
              test -n "${!name}" || { echo "::error::Missing $name secret"; exit 1; }
            done
            import_p12 "$APPLE_INSTALLER_CERTIFICATE_P12" "$APPLE_INSTALLER_CERTIFICATE_PASSWORD"
            echo "$MACOS_PROVISIONING_PROFILE_B64" | base64 -d > "$RUNNER_TEMP/macos.provisionprofile"
            echo "MACOS_PROVISIONING_PROFILE=$RUNNER_TEMP/macos.provisionprofile" >> "$GITHUB_ENV"
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # Signing identities are the names of the imported certificates (the names are not secret).
          identities=$(security find-identity -v "$keychain")
          echo "$identities"
          dist=$(echo "$identities" | sed -n 's/.*"\(Apple Distribution: [^"]*\)".*/\1/p' | head -n1)
          installer=$(echo "$identities" | sed -n 's/.*"\(3rd Party Mac Developer Installer: [^"]*\)".*/\1/p' | head -n1)
          test -n "$dist" || { echo "::error::No Apple Distribution identity in the imported certificate"; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$dist" >> "$GITHUB_ENV"
          if [ "$TARGET" = macos ]; then
            test -n "$installer" || { echo "::error::No 3rd Party Mac Developer Installer certificate imported"; exit 1; }
            echo "MACOS_INSTALLER_IDENTITY=$installer" >> "$GITHUB_ENV"
          fi
          # iOS signs with the same distribution certificate and a hand-made App Store profile (the API key cannot use cloud-managed
          # certificates). Tauri reads these three variables and installs them itself. The Mac build must not set any of the
          # APPLE_API_* variables: with them Tauri notarizes for Developer ID, which an App Store build is not signed for.
          if [ "$TARGET" = ios ]; then
            test -n "$IOS_PROVISIONING_PROFILE_B64" || { echo "::error::Missing IOS_PROVISIONING_PROFILE_B64 secret"; exit 1; }
            echo "IOS_CERTIFICATE=$APPLE_CERTIFICATE_P12" >> "$GITHUB_ENV"
            echo "IOS_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
            echo "IOS_MOBILE_PROVISION=$IOS_PROVISIONING_PROFILE_B64" >> "$GITHUB_ENV"
          fi

      - name: Build
        shell: bash
        run: node build/build-tauri.mjs "$TARGET" --channel=${{ inputs.channel }} ${{ inputs.channel == 'fdroid' && '--abi=arm64-v8a' || '' }}
        env:
          # App Store Connect wants a higher build number for every upload of one version; the run number only rises.
          APPSTORE_BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          IOS_EXPORT_METHOD: ${{ inputs.channel == 'appstore-ios' && 'app-store-connect' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MSSTORE_IDENTITY_NAME: ${{ secrets.MSSTORE_IDENTITY_NAME }}
          MSSTORE_PUBLISHER: ${{ secrets.MSSTORE_PUBLISHER }}
          MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ secrets.MSSTORE_PUBLISHER_DISPLAY_NAME }}

      - name: Build Windows ARM64 package
        if: inputs.channel == 'msstore'
        shell: bash
        run: node build/build-tauri.mjs "$TARGET" --channel=msstore --arm64
        env:
          MSSTORE_IDENTITY_NAME: ${{ secrets.MSSTORE_IDENTITY_NAME }}
          MSSTORE_PUBLISHER: ${{ secrets.MSSTORE_PUBLISHER }}
          MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ secrets.MSSTORE_PUBLISHER_DISPLAY_NAME }}

      - name: Name artifacts MajesticTab-<channel>-<version>
        shell: bash
        run: |
          version=$(node -p "require('./build/tauri/src-tauri/tauri.conf.json').version")
          mkdir -p store-dist
          for entry in dist/*; do
            name=$(basename "$entry")
            ext="${name#*.}"
            # Keep a "-symbols" marker so the debug symbols zip isn't mistaken for the app.
            case "$name" in *-symbols.*) kind="-symbols" ;; *-arm64.*) kind="-arm64" ;; *) kind="" ;; esac
            out="store-dist/MajesticTab-${{ inputs.channel }}-${version}${kind}.${ext}"
            [ ! -e "$out" ] && [ ! -e "$out.zip" ] || { echo "::error::Two build outputs map to $out"; exit 1; }
            if [ -d "$entry" ]; then
              ditto -c -k --keepParent "$entry" "$out.zip"
            else
              cp "$entry" "$out"
            fi
          done
          ls -l store-dist
      - uses: actions/upload-artifact@v7
        with:
          name: store-${{ inputs.channel }}
          path: store-dist/*
          if-no-files-found: error
      - name: Remove Apple signing material
        if: always() && (inputs.channel == 'appstore-ios' || inputs.channel == 'appstore-mac')
        shell: bash
        run: |
          security delete-keychain "$APPSTORE_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/macos.provisionprofile"
