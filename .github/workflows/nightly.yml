name: Nightly

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build even if nothing changed since the last nightly
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      build_id: ${{ steps.diff.outputs.build_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        run: |
          echo "build_id=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          last=$(git rev-parse -q --verify refs/tags/nightly || true)
          if [ "${{ inputs.force }}" = "true" ] || [ "$last" != "$GITHUB_SHA" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      channel: nightly
      build_id: ${{ needs.check.outputs.build_id }}

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Replace nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Automated nightly build of $GITHUB_SHA.

          ### Opening on macOS

          The macOS build is not signed or notarized, so Gatekeeper may say the app is damaged or from an unidentified developer. After dragging MajesticTab to Applications, either:

          - Run \`xattr -dr com.apple.quarantine /Applications/MajesticTab.app\` in Terminal, then open the app; or
          - Try to open it once, then go to System Settings > Privacy & Security and click **Open Anyway**.

          EOF
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly artifacts/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Nightly ${{ needs.check.outputs.build_id }}" \
            --notes-file notes.md
