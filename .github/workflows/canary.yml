name: Canary

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: canary
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      build_id: ${{ steps.diff.outputs.build_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        run: |
          echo "build_id=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      channel: canary
      build_id: ${{ needs.check.outputs.build_id }}

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Build updater manifest
        run: |
          app_version=$(node -p "require('./build/tauri/src-tauri/tauri.conf.json').version")
          node build/make-update-manifest.mjs artifacts "${app_version}" \
            "https://github.com/${{ github.repository }}/releases/download/canary" \
            artifacts/latest.json "Canary ${{ needs.check.outputs.build_id }}"
      - name: Replace canary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Automated canary build of $GITHUB_SHA.

          ### Opening on macOS

          The macOS build is not signed or notarized, so Gatekeeper may say the app is damaged or from an unidentified developer. After dragging MajesticTab to Applications, either:

          - Run \`xattr -dr com.apple.quarantine /Applications/MajesticTab.app\` in Terminal, then open the app; or
          - Try to open it once, then go to System Settings > Privacy & Security and click **Open Anyway**.

          ### Sideloading on iOS

          Sideload \`MajesticTab-ios.ipa\` using AltStore, SideStore, or Sideloadly.

          EOF
          gh release delete canary --cleanup-tag --yes || true
          gh release create canary artifacts/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Canary ${{ needs.check.outputs.build_id }}" \
            --notes-file notes.md
