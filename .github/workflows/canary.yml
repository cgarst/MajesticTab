name: Canary

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: canary
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      build_id: ${{ steps.diff.outputs.build_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        run: |
          echo "build_id=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      channel: canary
      build_id: ${{ needs.check.outputs.build_id }}

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Name assets MajesticTab-<version>-<platform>
        run: node build/name-release-assets.mjs artifacts "$(node -p "require('./build/tauri/src-tauri/tauri.conf.json').version")"
      - name: Build updater manifest
        run: |
          app_version=$(node -p "require('./build/tauri/src-tauri/tauri.conf.json').version")
          node build/make-update-manifest.mjs artifacts "${app_version}" \
            "https://github.com/${{ github.repository }}/releases/download/canary" \
            artifacts/latest.json "Canary ${{ needs.check.outputs.build_id }}"
      # The updater reads each signature from latest.json, so the .sig files are not release assets.
      - name: Drop updater signature files
        run: rm -f artifacts/*.sig
      - name: Replace canary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Automated canary build of $GITHUB_SHA.
          EOF
          gh release delete canary --cleanup-tag --yes || true
          gh release create canary artifacts/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Canary ${{ needs.check.outputs.build_id }}" \
            --notes-file notes.md

  # Put the canary Flatpak bundles on the `canary` branch of the Zathu Flatpak repo (see release.yml for the token).
  publish-flatpak:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Publish to the Zathu Flatpak repo
        env:
          GH_TOKEN: ${{ secrets.FLATPAK_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::FLATPAK_REPO_TOKEN secret is not set; skipping the Flatpak repo update"
            exit 0
          fi
          gh api repos/cgarst/zathu-flatpak/dispatches -f event_type=publish-flatpak \
            -f "client_payload[source_repo]=${{ github.repository }}" \
            -f "client_payload[tag]=canary"
