name: Build

on:
  workflow_call:
    inputs:
      channel:
        description: stable or nightly
        required: true
        type: string
      build_id:
        description: Build identifier embedded in the app (used by the update checker)
        required: true
        type: string

env:
  MAJESTICTAB_CHANNEL: ${{ inputs.channel }}
  MAJESTICTAB_BUILD_ID: ${{ inputs.build_id }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: build/tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: build/tauri/src-tauri -> ../target
      - run: node build/build-tauri.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: build/tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: build/tauri/src-tauri -> ../target
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev patchelf libayatana-appindicator3-dev
      - name: Install Flatpak runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//48 org.gnome.Sdk//48
      - run: node build/build-tauri.mjs linux
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*.flatpak
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: build/tauri/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: build/tauri/src-tauri -> ../target
      - name: Locate Android NDK
        run: echo "NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
      - run: node build/build-tauri.mjs android
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error
