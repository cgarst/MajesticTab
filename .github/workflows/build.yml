name: Build

on:
  workflow_call:
    inputs:
      channel:
        description: stable or canary
        required: true
        type: string
      build_id:
        description: Build identifier embedded in the app (used by the update checker)
        required: true
        type: string

env:
  MAJESTICTAB_CHANNEL: ${{ inputs.channel }}
  MAJESTICTAB_BUILD_ID: ${{ inputs.build_id }}
  TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact: windows
          - os: windows-latest
            target: windows
            artifact: windows-arm64
            args: --arm64
            rust_target: aarch64-pc-windows-msvc
          - os: macos-latest
            target: macos
            artifact: macos-arm64
          - os: macos-latest
            target: macos
            artifact: macos-x86_64
            args: --x86_64
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: build/tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: build/tauri/src-tauri -> ../target
          key: ${{ matrix.artifact }}
      - name: Set up macOS Developer ID signing
        if: matrix.target == 'macos'
        env:
          DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          if [ -z "$DEVELOPER_ID_CERTIFICATE_P12" ] || [ -z "$DEVELOPER_ID_CERTIFICATE_PASSWORD" ]; then
            echo "::warning::DEVELOPER_ID_CERTIFICATE_* secrets are not set; building ad-hoc signed macOS bundle"
            exit 0
          fi
          keychain="$RUNNER_TEMP/devid.keychain-db"
          password=$(uuidgen)
          echo "DEVID_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "$DEVELOPER_ID_CERTIFICATE_P12" | base64 -d > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$keychain" -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/devid.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n1)
          test -n "$identity" || { echo "::error::No Developer ID Application identity in the imported certificate"; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_CONTENT" ]; then
            key_path="$RUNNER_TEMP/AuthKey.p8"
            printf '%s\n' "$ASC_KEY_CONTENT" > "$key_path"
            chmod 600 "$key_path"
            echo "APPLE_API_KEY=$ASC_KEY_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$ASC_ISSUER_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          else
            echo "::warning::ASC_* secrets are not set; skipping macOS notarization"
          fi
      - run: node build/build-tauri.mjs ${{ matrix.target }} ${{ matrix.args }}
      - name: Remove macOS signing material
        if: always() && matrix.target == 'macos'
        run: |
          if [ -n "${DEVID_KEYCHAIN:-}" ]; then
            security delete-keychain "$DEVID_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/devid.p12" "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-26.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: build/tauri/package-lock.json
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
      - name: Install Flatpak runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//51 org.gnome.Sdk//51
      - run: node build/build-tauri.mjs linux
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.flatpak
          if-no-files-found: error

  # The self-updating AppImage (x86_64 and ARM64), signed for the updater like the Windows and macOS bundles. Built on the
  # oldest runner images so it runs on older glibc.
  appimage:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: build/tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: build/tauri/src-tauri -> ../target
          key: appimage-${{ matrix.arch }}
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libasound2-dev patchelf xdg-utils file
      - run: node build/build-tauri.mjs linux --channel=appimage
      - uses: actions/upload-artifact@v7
        with:
          name: linux-appimage-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: build/tauri/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: build/tauri/src-tauri -> ../target
      - name: Locate Android NDK
        run: |
          if [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_PATH=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
            echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          elif [ -n "$ANDROID_NDK_HOME" ]; then
            echo "NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          fi
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_B64" || { echo "::error::Missing ANDROID_KEYSTORE_B64 secret"; exit 1; }
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: node build/build-tauri.mjs android
        env:
          GOOGLE_TV_CLIENT_ID: ${{ secrets.GOOGLE_TV_CLIENT_ID }}
          GOOGLE_TV_CLIENT_SECRET: ${{ secrets.GOOGLE_TV_CLIENT_SECRET }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  # The fdroid channel (no Google Play services, no self-update) signed with the release key. F-Droid verifies its own
  # build against this APK; it is its own job so the Android project is not reused. It must stay identical to F-Droid's
  # recipe (fdroiddata metadata/net.zathu.majestictab.yml): the same Debian packages, Rust and NDK, installed the same way.
  # One APK per ABI, like F-Droid's one Builds entry each (ABI split): armeabi-v7a, arm64-v8a and x86_64.
  android-no-gms:
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86_64]
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
      ANDROID_HOME: /opt/android-sdk
    steps:
      - name: Install build tools from Debian
        run: |
          apt-get update
          apt-get install -y git ca-certificates curl unzip build-essential openjdk-21-jdk-headless nodejs npm rustup
          update-java-alternatives -s java-1.21.0-openjdk-amd64 || true
      - uses: actions/checkout@v5
      - name: Install Rust 1.99.1
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          rustup default 1.99.1
      - name: Install Android NDK r27c
        run: |
          curl -sSfLo /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          echo '2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258  /tmp/cmdline-tools.zip' | sha256sum -c -
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_B64" || { echo "::error::Missing ANDROID_KEYSTORE_B64 secret"; exit 1; }
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: node build/build-tauri.mjs android --channel=fdroid --abi=${{ matrix.abi }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: android-no-gms-${{ matrix.abi }}
          path: dist/*.apk
          if-no-files-found: error

  ios:
    # xcode-27 image: iOS 27.1 SDK for the fold plugin (macos-latest ships Xcode 26)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: build/tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: build/tauri/src-tauri -> ../target
          key: ios
      - name: Install iOS build tools
        run: |
          brew install xcodegen
      # Compile check only. The IPA is not uploaded: iOS builds ship through App Store Connect (store-build.yml), and the
      # Apple Developer Program License Agreement (section 7.6) does not allow handing out an iOS app any other way.
      - run: node build/build-tauri.mjs ios
