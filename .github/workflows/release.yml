name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match app version
        run: |
          version=$(node -p "require('./build/tauri/src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match tauri.conf.json version $version" >&2
            exit 1
          fi
      - name: Release notes must be written
        run: node build/release-notes.mjs > /dev/null

  build:
    needs: verify
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      channel: stable
      build_id: ${{ github.ref_name }}

  # Store binaries stay workflow artifacts (store-<channel>); publish excludes them so they never
  # reach the GitHub release or latest.json.
  store:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        # fdroid is built (signed) by build.yml's android-no-gms job for the release; F-Droid builds its own unsigned
        # copy from source. The appstore channels use the run number as the build number.
        channel: [play, msstore, appstore-ios, appstore-mac]
    uses: ./.github/workflows/store-build.yml
    secrets: inherit
    with:
      channel: ${{ matrix.channel }}
      build_id: ${{ github.ref_name }}

  # Submit the store binaries built above. These need the secrets listed in each job; a missing secret
  # fails only that job, never the GitHub release.
  publish-play:
    needs: [build, store]
    runs-on: ubuntu-latest
    steps:
      # Checkout first: it cleans untracked files, which would delete the downloaded artifact.
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: store-play
          path: store-play
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Decode Play service account
        env:
          PLAY_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          test -n "$PLAY_SERVICE_ACCOUNT_JSON_B64" || { echo "::error::Missing PLAY_SERVICE_ACCOUNT_JSON_B64 secret"; exit 1; }
          echo "$PLAY_SERVICE_ACCOUNT_JSON_B64" | base64 -d > "$RUNNER_TEMP/play-sa.json"
      # Uploads the AAB and debug symbols, then syncs the listing text and images from
      # fastlane/metadata/android and support/listing (the Play API has no desktop screenshot type).
      - name: Upload to Google Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ runner.temp }}/play-sa.json
          # The release is uploaded to PLAY_TRACK, then copied to PLAY_PROMOTE_TO (closed testing "alpha" by default). Set the PLAY_PROMOTE_TO repo variable to production once the listing is live.
          PLAY_TRACK: ${{ vars.PLAY_TRACK || 'internal' }}
          PLAY_PROMOTE_TO: ${{ vars.PLAY_PROMOTE_TO || 'alpha' }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
        run: |
          bundle exec fastlane android release aab:'store-play/*.aab' symbols:'store-play/*-symbols.zip' release_name:"$GITHUB_REF_NAME"

  publish-msstore:
    needs: [build, store]
    runs-on: windows-latest
    steps:
      # Checkout first: it cleans untracked files, which would delete the downloaded artifact.
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: store-msstore
          path: store-msstore
      - uses: microsoft/microsoft-store-apppublisher@v1.4
      # Uses the msstore CLI throughout (microsoft/store-submission is deprecated).
      - name: Upload package, sync listing, and submit
        shell: bash
        run: |
          msstore reconfigure --tenantId "$MSSTORE_TENANT_ID" --sellerId "$MSSTORE_SELLER_ID" \
            --clientId "$MSSTORE_CLIENT_ID" --clientSecret "$MSSTORE_CLIENT_SECRET"
          # Upload the package but keep the submission in draft. This recreates the draft, so it must
          # run before the listing edits below.
          # Both architectures go up as one bundle so the Store serves the right one per device.
          makeappx="$(find "/c/Program Files (x86)/Windows Kits/10/bin" -name makeappx.exe -path '*x64*' | sort -V | tail -n1)"
          mkdir -p bundle-in
          cp store-msstore/*.msix bundle-in/
          # Without /bv makeappx stamps the bundle with the build date; match the MSIX version instead.
          version=$(node -p "require('./build/tauri/src-tauri/tauri.conf.json').version")
          "$makeappx" bundle //o //bv "$version.0" //d bundle-in //p MajesticTab-msstore.msixbundle
          # A package file as the path (not a directory) selects the CLI's MSIX publisher, which uploads it as is.
          msstore publish MajesticTab-msstore.msixbundle --appId "$MSSTORE_PRODUCT_ID" --noCommit
          # Sync the listing text from support/store/description.txt into the draft. The CLI round-trips
          # the whole draft, so pricing and other settings entered in Partner Center are preserved.
          msstore submission get "$MSSTORE_PRODUCT_ID" > draft.json
          python3 support/tools/msstore_listing.py draft.json en-us
          msstore submission update "$MSSTORE_PRODUCT_ID" "$(cat draft.json)"
          msstore submission publish "$MSSTORE_PRODUCT_ID"
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_PRODUCT_ID: ${{ secrets.MSSTORE_PRODUCT_ID }}

  # Upload to TestFlight only; submitting for App Store review stays manual in App Store Connect. External distribution happens
  # in the lane when the TESTFLIGHT_GROUPS repo variable names the external group(s). Skipped when the ASC_* secrets are missing.
  publish-appstore-ios:
    needs: [build, store]
    runs-on: xcode-27
    steps:
      # Checkout first: it cleans untracked files, which would delete the downloaded artifact.
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: store-appstore-ios
          path: store-appstore-ios
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          TESTFLIGHT_GROUPS: ${{ vars.TESTFLIGHT_GROUPS }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_CONTENT" ]; then
            echo "::warning::ASC_* secrets are not set; skipping the TestFlight upload"
            exit 0
          fi
          bundle exec fastlane ios beta ipa:"$(ls store-appstore-ios/*.ipa)"

  publish-appstore-mac:
    needs: [build, store]
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: store-appstore-mac
          path: store-appstore-mac
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          TESTFLIGHT_GROUPS: ${{ vars.TESTFLIGHT_GROUPS }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_CONTENT" ]; then
            echo "::warning::ASC_* secrets are not set; skipping the TestFlight upload"
            exit 0
          fi
          bundle exec fastlane mac beta pkg:"$(ls store-appstore-mac/*.pkg)"

  publish:
    needs: [build, store]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: '!store-*'
          merge-multiple: true
      - name: Name assets MajesticTab-<version>-<platform>
        run: node build/name-release-assets.mjs artifacts "${GITHUB_REF_NAME#v}"
      - name: Build updater manifest
        run: |
          node build/make-update-manifest.mjs artifacts "${GITHUB_REF_NAME#v}" \
            "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}" \
            artifacts/latest.json "$(node build/release-notes.mjs)"
      # The updater reads each signature from latest.json, so the .sig files are not release assets.
      - name: Drop updater signature files
        run: rm -f artifacts/*.sig
      - name: Build SideStore source
        run: |
          node build/make-sidestore-source.mjs "${GITHUB_REF_NAME#v}" "artifacts/MajesticTab-${GITHUB_REF_NAME#v}-ios.ipa" \
            artifacts/source.json "https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}" \
            "$(node build/release-notes.mjs)"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          { node build/release-notes.mjs; echo; cat <<'EOF'
          ### Opening on macOS

          The macOS build is not signed or notarized, so Gatekeeper may say the app is damaged or from an unidentified developer. After dragging MajesticTab to Applications, either:

          - Run `xattr -dr com.apple.quarantine /Applications/MajesticTab.app` in Terminal, then open the app; or
          - Try to open it once, then go to System Settings > Privacy & Security and click **Open Anyway**.

          ### Sideloading on iOS

          Sideload the `-ios.ipa` asset using AltStore, SideStore, TrollStore, or Sideloadly.

          To add MajesticTab as a SideStore, AltStore, or LiveContainer source, use `https://github.com/cgarst/MajesticTab/releases/latest/download/source.json`.

          EOF
          } > notes.md
          gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md

  # Update the F-Droid recipe after the GitHub release has uploaded the three signed no-gms APKs.
  publish-fdroid:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update F-Droid recipe
        env:
          FDROID_GITLAB_PAT: ${{ secrets.FDROID_GITLAB_PAT }}
        run: |
          if [ -z "$FDROID_GITLAB_PAT" ]; then
            echo "::warning::FDROID_GITLAB_PAT secret is not set; skipping F-Droid recipe update"
            exit 0
          fi

          askpass="$RUNNER_TEMP/gitlab-askpass.sh"
          cat <<'EOF' > "$askpass"
          #!/bin/sh
          case "$1" in
            *Username*) echo "oauth2" ;;
            *) printf '%s\n' "$FDROID_GITLAB_PAT" ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0

          git clone --depth 1 --branch net.zathu.majestictab \
            https://gitlab.com/corey.garst/fdroiddata.git "$RUNNER_TEMP/fdroiddata"

          commit=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          version="${GITHUB_REF_NAME#v}"
          python3 build/update-fdroid-recipe.py \
            --recipe "$RUNNER_TEMP/fdroiddata/metadata/net.zathu.majestictab.yml" \
            --commit "$commit"
          python3 -c "import yaml; yaml.safe_load(open('$RUNNER_TEMP/fdroiddata/metadata/net.zathu.majestictab.yml'))"

          if git -C "$RUNNER_TEMP/fdroiddata" diff --quiet metadata/net.zathu.majestictab.yml; then
            echo "F-Droid recipe is already up to date for $version"
            exit 0
          fi

          git -C "$RUNNER_TEMP/fdroiddata" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/fdroiddata" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$RUNNER_TEMP/fdroiddata" commit -am "net.zathu.majestictab: update to $version"
          git -C "$RUNNER_TEMP/fdroiddata" push origin net.zathu.majestictab
