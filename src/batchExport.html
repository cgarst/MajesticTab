<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk Export — MajesticTab</title>
  <link rel="icon" type="image/x-icon" href="icons/favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.3/umd/index.js"></script>
  <style>
    body {
      overflow-y: auto !important;
      height: auto !important;
      min-height: 100vh;
    }
    .export-container {
      max-width: 820px;
      margin: 2.5rem auto 4rem auto;
      padding: 0 1.25rem;
    }
    .export-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 12px 32px -4px rgba(0, 0, 0, 0.6);
    }
    .export-header {
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
    }
    .drop-zone {
      border: 2px dashed var(--border-prominent);
      background: var(--bg-card-solid);
      border-radius: 0.85rem;
      padding: 2.5rem 1.5rem;
      text-align: center;
      margin-bottom: 1.5rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text-muted);
    }
    .drop-zone.dragover {
      border-color: var(--accent-primary);
      background: var(--bg-card-hover);
      color: var(--text-primary);
    }
    @media (hover: hover) {
      .drop-zone:hover {
        border-color: var(--accent-primary);
        background: var(--bg-card-hover);
        color: var(--text-primary);
      }
    }
    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: var(--bg-card-solid);
      border: 1px solid var(--border-subtle);
      border-radius: 0.6rem;
      margin-bottom: 0.5rem;
    }
    .status-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      margin-right: 0.75rem;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .status-icon.complete {
      opacity: 1;
      color: #10b981;
    }
    .progress-container {
      display: none;
      margin: 1.25rem 0;
    }
    .progress-bar-custom {
      height: 12px;
      background: var(--accent-primary);
      width: 0%;
      transition: width 0.3s ease;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <!-- Windows native shell: custom window controls (shown via .tauri-windows) -->
  <div id="winControls" role="group" aria-label="Window controls">
    <button type="button" class="win-ctrl-btn" id="winMinBtn" title="Minimize" aria-label="Minimize"><i class="bi-dash-lg"></i></button>
    <button type="button" class="win-ctrl-btn" id="winMaxBtn" title="Maximize" aria-label="Maximize"><i class="bi-square" id="winMaxIcon"></i></button>
    <button type="button" class="win-ctrl-btn win-ctrl-close" id="winCloseBtn" title="Close" aria-label="Close"><i class="bi-x-lg"></i></button>
  </div>

  <!-- Minimal Header Bar -->
  <header id="topBar" data-tauri-drag-region>
    <div id="brandSection" data-tauri-drag-region>
      <a href="./" class="brand-btn text-decoration-none" title="Return to MajesticTab">
        <i class="bi-arrow-left me-1"></i> Back to App
      </a>
      <span class="fs-6 fw-bold tracking-tight text-white ms-2">MajesticTab</span>
    </div>
    <div id="rightSection" data-tauri-drag-region></div>
  </header>

  <main class="export-container">
    <div class="export-card">
      <div class="export-header">
        <div class="d-flex align-items-center gap-3 mb-2">
          <div class="brand-btn p-2" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 0.85rem;">
            <i class="bi-file-earmark-pdf text-danger fs-4"></i>
          </div>
          <div>
            <h1 class="h3 fw-bold text-white mb-0">Bulk export</h1>
            <div class="small text-muted">Export your whole library as original files</div>
          </div>
        </div>
      </div>

      <section class="mb-4">
        <h2 class="h6 fw-bold text-white mb-1">Original files</h2>
        <div class="small text-muted mb-2">Every tab in your library exactly as you added it (Guitar Pro, PDF and others), organized into artist and album folders in one ZIP.</div>
        <div class="d-flex align-items-center flex-wrap gap-2">
          <button type="button" id="exportOriginalsBtn" class="btn btn-theme-primary d-flex align-items-center gap-2">
            <i class="bi-file-earmark-zip"></i> <span id="exportOriginalsBtnText">Export Library as ZIP</span>
          </button>
          <span id="exportOriginalsStatus" class="small text-muted"></span>
        </div>
      </section>
    </div>
  </main>

  <script type="module">
    import { initTheming } from './themeEngine.js';
    import { getAllSongs, getCollections } from './libraryStore.js';
    import { getStoredFile } from './fileStore.js';

    // Initialize active theme
    initTheming();

    // Native macOS shell uses an overlay title bar; reserve room for the traffic lights.
    if (window.__TAURI__ && /Mac/i.test(navigator.platform)) {
      const root = document.documentElement;
      root.classList.add('tauri-macos');
      const appWindow = window.__TAURI__.window?.getCurrentWindow?.();
      let syncToken = 0;
      const syncTitleBarInset = async () => {
        const token = ++syncToken;
        let fs = !!(document.fullscreenElement || document.webkitFullscreenElement);
        if (!fs && appWindow) {
          try { fs = await appWindow.isFullscreen(); } catch {}
        }
        if (token === syncToken) root.classList.toggle('window-fullscreen', fs);
      };
      let settleTimer = 0;
      const scheduleSync = () => {
        syncTitleBarInset();
        clearTimeout(settleTimer);
        settleTimer = setTimeout(syncTitleBarInset, 600);
      };
      syncTitleBarInset();
      window.addEventListener('resize', scheduleSync);
      document.addEventListener('fullscreenchange', scheduleSync);
      document.addEventListener('webkitfullscreenchange', scheduleSync);
    }

    // Native Windows shell is undecorated; draw window controls on the right and shift the top bar controls left.
    if (window.__TAURI__ && /Win/i.test(navigator.platform)) {
      const root = document.documentElement;
      root.classList.add('tauri-windows');
      const appWindow = window.__TAURI__.window?.getCurrentWindow?.();
      const maxIcon = document.getElementById('winMaxIcon');
      const maxBtn = document.getElementById('winMaxBtn');
      let syncToken = 0;
      const syncWindowState = async () => {
        const token = ++syncToken;
        let fs = !!(document.fullscreenElement || document.webkitFullscreenElement);
        let maximized = false;
        if (appWindow) {
          try { if (!fs) fs = await appWindow.isFullscreen(); } catch {}
          try { maximized = await appWindow.isMaximized(); } catch {}
        }
        if (token !== syncToken) return;
        root.classList.toggle('window-fullscreen', fs);
        if (maxIcon) maxIcon.className = maximized ? 'bi-fullscreen-exit' : 'bi-square';
        if (maxBtn) { const t = maximized ? 'Restore' : 'Maximize'; maxBtn.title = t; maxBtn.setAttribute('aria-label', t); }
      };
      let settleTimer = 0;
      const scheduleSync = () => {
        syncWindowState();
        clearTimeout(settleTimer);
        settleTimer = setTimeout(syncWindowState, 400);
      };
      document.getElementById('winMinBtn')?.addEventListener('click', () => appWindow?.minimize());
      maxBtn?.addEventListener('click', () => appWindow?.toggleMaximize());
      document.getElementById('winCloseBtn')?.addEventListener('click', () => appWindow?.close());
      syncWindowState();
      window.addEventListener('resize', scheduleSync);
      document.addEventListener('fullscreenchange', scheduleSync);
      document.addEventListener('webkitfullscreenchange', scheduleSync);
    }

    function safeName(str, fallback = 'Untitled') {
      const cleaned = String(str || '').replace(/[/\\?%*:|"<>]/g, '_').replace(/\s+/g, ' ').trim();
      return cleaned || fallback;
    }

    function downloadBlob(blob, filename) {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    }

    function uniquePath(path, used) {
      if (!used.has(path)) {
        used.add(path);
        return path;
      }
      const dot = path.lastIndexOf('.');
      const base = dot > path.lastIndexOf('/') ? path.slice(0, dot) : path;
      const ext = dot > path.lastIndexOf('/') ? path.slice(dot) : '';
      let n = 2;
      while (used.has(`${base} (${n})${ext}`)) n++;
      const next = `${base} (${n})${ext}`;
      used.add(next);
      return next;
    }

    // Original files: every stored tab file in the library, zipped as Artist/Album/file
    const exportOriginalsBtn = document.getElementById('exportOriginalsBtn');
    const exportOriginalsBtnText = document.getElementById('exportOriginalsBtnText');
    const exportOriginalsStatus = document.getElementById('exportOriginalsStatus');
    exportOriginalsBtn?.addEventListener('click', async () => {
      exportOriginalsBtn.disabled = true;
      exportOriginalsBtnText.textContent = 'Exporting...';
      exportOriginalsStatus.textContent = '';
      try {
        const songs = await getAllSongs();
        const collections = await getCollections().catch(() => []);
        const collectionNames = new Map(collections.map(c => [c.id, c.name]));
        const multipleCollections = collections.length > 1;
        const entries = {};
        const usedPaths = new Set();
        const seenFileIds = new Set();
        let count = 0;
        let total = songs.reduce((n, song) => n + (Array.isArray(song.tabOptions) ? song.tabOptions.length : 0), 0);
        let done = 0;

        for (const song of songs) {
          const tabs = Array.isArray(song.tabOptions) ? song.tabOptions : [];
          for (const t of tabs) {
            done++;
            exportOriginalsStatus.textContent = `Reading ${done} of ${total}...`;
            if (!t.fileStoreId) continue;
            const stored = await getStoredFile(t.fileStoreId);
            if (!stored?.file) continue;
            const dedupeKey = `${song.id}_${t.fileStoreId}`;
            if (seenFileIds.has(dedupeKey)) continue;
            seenFileIds.add(dedupeKey);

            const parts = [];
            if (multipleCollections) parts.push(safeName(collectionNames.get(song.collectionId), 'Library'));
            parts.push(safeName(song.artist, 'Unknown Artist'));
            if (song.album) parts.push(safeName(song.album));
            parts.push(safeName(stored.file.name, 'tab'));
            const path = uniquePath(parts.join('/'), usedPaths);
            entries[path] = [new Uint8Array(await stored.file.arrayBuffer()), { level: 0 }];
            count++;
          }
        }

        if (count === 0) {
          exportOriginalsStatus.textContent = 'No tab files found in library';
          return;
        }
        exportOriginalsStatus.textContent = 'Building ZIP...';
        const zipped = fflate.zipSync(entries);
        downloadBlob(new Blob([zipped], { type: 'application/zip' }), `MajesticTab_Library_${new Date().toISOString().slice(0, 10)}.zip`);
        exportOriginalsStatus.textContent = `Exported ${count} file${count === 1 ? '' : 's'}`;
      } catch (err) {
        console.error('Error exporting library files:', err);
        exportOriginalsStatus.textContent = 'Export failed';
      } finally {
        exportOriginalsBtn.disabled = false;
        exportOriginalsBtnText.textContent = 'Export Library as ZIP';
      }
    });
  </script>
</body>
</html>
